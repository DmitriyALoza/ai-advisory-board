services:
  ai_advisory_board:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=data/advisory_board.db
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
      - ./data:/app/data
    command: >
      streamlit run app/Home.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.fileWatcherType=poll
      --server.runOnSave=true
    restart: unless-stopped
